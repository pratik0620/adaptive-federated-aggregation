# ==============================================================================
# PadChest Pilot / Smoke Test Configuration (Client 03 — Pleural Effusion)
# ==============================================================================
# Lightweight configuration for quick smoke testing or small accessible subsets.
# ==============================================================================

# Dataset identification
dataset: PadChest
client_id: client_03_PadChest
target_disease: Pleural Effusion

# Dataset filesystem locations
metadata: data/raw/PadChest/metadata/PADCHEST_chest_x_ray_images_labels_160K_01.02.19.csv.gz
image_dir: data/raw/PadChest/images
processed_dir: data/processed/PadChest
output_dir: outputs/padchest
run_name: padchest_pilot_resnet50

# Binary Label Policy
target_label: pleural effusion
negative_label: normal

# Frontal Projection Policy
frontal_only: true
include_ap_horizontal: true

# Patient-Level Splitting
seed: 42
train_size: 0.8
val_size: 0.1
test_size: 0.1

# Pilot Subsetting
pilot: true
patient_limit: 100
patient_start: null
patient_end: null
sample_from_accessible: true

epochs: 2
batch_size: 16
lr: 0.0001
weight_decay: 0.0001
optimizer: adamw
scheduler: cosine
metric_to_optimize: val_auroc
pos_weight: null

# Model Architecture
model_architecture: resnet50
classification_head: single_logit_binary
img_size: 224
pretrained: true
dropout: 0.0

# Hardware & System
device: null
num_workers: 0
use_amp: false

# Path Resolution & Preflight
strict_paths: false
filter_missing: true
dry_run: false
