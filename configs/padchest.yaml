# ==============================================================================
# PadChest Federated Client Configuration (Client 03 — Pleural Effusion)
# ==============================================================================
# Official PadChest dataset configuration for reproducible ResNet-50 training.
#
# Usage:
#   python scripts/prepare_padchest.py --config configs/padchest.yaml
#   python scripts/preflight_padchest.py --config configs/padchest.yaml
#   python scripts/train_padchest.py --config configs/padchest.yaml
# ==============================================================================

# Dataset identification
dataset: PadChest
client_id: client_03_PadChest
target_disease: Pleural Effusion

# Dataset filesystem locations
metadata: data/raw/PadChest/metadata/PADCHEST_chest_x_ray_images_labels_160K_01.02.19.csv.gz
image_dir: data/raw/PadChest/images
processed_dir: data/processed/PadChest
output_dir: outputs/padchest
run_name: padchest_client03_resnet50

# Binary Label Policy
# Positive: record contains 'pleural effusion'
# Negative: record contains solely 'normal'
# Excluded: ambiguous, unmentioned, or non-effusion findings
target_label: pleural effusion
negative_label: normal

# Frontal Projection Policy
# Retain PA, AP, and AP_horizontal (supine bedside AP)
# Exclude Lateral (L) and Costal rib detail views
frontal_only: true
include_ap_horizontal: true

# Patient-Level Splitting
seed: 42
train_size: 0.8
val_size: 0.1
test_size: 0.1

# Training Hyperparameters
# Set patient_limit to null for full training cohort, or an integer for pilot training
patient_limit: null
patient_start: null
patient_end: null
sample_from_accessible: false

epochs: 10
batch_size: 32
lr: 0.0001
weight_decay: 0.0001
optimizer: adamw
scheduler: cosine
metric_to_optimize: val_auroc
pos_weight: null

# Model Architecture
model_architecture: resnet50
classification_head: single_logit_binary
img_size: 224
pretrained: true
dropout: 0.0

# Hardware & System
# Device: null auto-detects CUDA if available, falls back to CPU
device: null
num_workers: 0
use_amp: false

# Path Resolution & Preflight
strict_paths: false
filter_missing: true
dry_run: false
